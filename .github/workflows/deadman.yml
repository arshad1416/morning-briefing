name: deadman-monitor
# External dead-man's switch for the live site. Runs on GitHub runners, so the
# Pi pushing data cannot affect it.
#
# Two INDEPENDENT failure modes, because watching only the first is what let
# both 2026-07-30 incidents run for days:
#   1. FRESHNESS — is the published data recent?      (Pi pipeline alive)
#   2. CONTRACT  — can the frontend still PARSE it?   (fresh but unusable)
# A payload can be perfectly fresh and completely unparseable: one missing
# required field throws the whole zod parse in src/lib/api/index.ts and blanks
# every component fed by that file. `premarket_top_setups` was absent from all
# 25 published versions of latest.json and no monitor ever noticed.

on:
  schedule:
    # Best-effort, not a clock: GitHub queues scheduled runs and the observed
    # median interval here is ~61 minutes, not 30. Never size an alert threshold
    # assuming this fires on time.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check public data freshness
        # One line per public payload the site actually renders: filename, then the
        # age at which it is unambiguously broken. Watching two files was never
        # enough — ibkr_*.json sat 28 days stale because nothing was looking at it.
        # The premium payloads still have no watcher and cannot get one here:
        # /api/data/* is 401 without a session cookie, which a GitHub runner has no
        # way to hold. archive-index.json is absent on purpose — it carries no
        # timestamp field, and it ships in the same daily push as latest.json, so a
        # bespoke parser for it would buy no signal that latest.json doesn't give.
        #
        # Thresholds are per file because the cadences differ by 3x:
        #   20h — publish-gated. push_dashboard runs every 30 min on weekdays but
        #         only once at 07:22 on Sat/Sun, so even crypto-cohorts (regenerated
        #         every 15 min on the Pi) reaches the site at most once a day.
        #         20h (not 26h) so a weekend/failed-morning pipeline alerts the same
        #         evening or before the next market open, not 26h later.
        #   80h — weekday-only generators. Measured Fri→Mon gap in git history is
        #         exactly 72h for both; anything tighter red-alerts every Sunday,
        #         which is how a monitor gets ignored and then muted.
        env:
          BASE_URL: https://maplegamma.com/data
          FRESHNESS: |
            maplegamma-data.json 20
            crypto-cohorts.json 20
            latest.json 20
            analysis.json 20
            briefing-intel.json 20
            reddit-sentiment.json 20
            options-status.json 20
            verdict.json 80
            screener-lite.json 80
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone, timedelta

          def age_hours(url):
              req = urllib.request.Request(url, headers={"User-Agent": "mg-deadman/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
              ts = None
              for k in ("generated_at", "_generated_at", "updated_at", "timestamp"):
                  if isinstance(d, dict) and k in d:
                      ts = d[k]; break
              if ts is None:
                  raise SystemExit(f"FAIL: no timestamp field in {url}")
              s = str(ts).replace("Z", "+00:00")
              try:
                  t = datetime.fromisoformat(s)
              except ValueError:
                  t = datetime.strptime(s[:16], "%Y-%m-%d %H:%M")
              if t.tzinfo is None:
                  t = t.replace(tzinfo=timezone(timedelta(hours=-4)))
              return (datetime.now(timezone.utc) - t).total_seconds() / 3600

          failures = []
          now = datetime.now(timezone.utc)
          # Weekend-aware thresholds: on Sat/Sun the publish-gated cadence is
          # 07:22 only (~24h between runs), so a 20h limit would red-alert every
          # weekend. Give the publish-gated entries +10h on weekends; the 80h
          # weekday-only entries are already weekend-safe.
          is_weekend = now.astimezone().weekday() >= 5
          for line in os.environ["FRESHNESS"].split("\n"):
              if not line.strip():
                  continue
              name, limit = line.split()
              limit = float(limit)
              if is_weekend and limit < 30:
                  limit += 10.0
              url = f"{os.environ['BASE_URL']}/{name}"
              try:
                  a = age_hours(url)
                  print(f"{name}: age={a:.1f}h (limit {limit}h{' +10 weekend' if is_weekend and limit > 20 else ''})")
                  if a > limit:
                      failures.append(f"{name} is {a:.1f}h old (limit {limit}h) — its generator may be DOWN")
              except SystemExit as e:
                  failures.append(str(e))
              except Exception as e:
                  failures.append(f"{name}: fetch failed: {e}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All fresh — pipeline alive.")
          PY

      # The contract check needs the repo's real zod schemas, so it cannot drift
      # from what the site actually enforces. `if: always()` because staleness and
      # a broken contract are independent problems with independent fixes — a
      # freshness failure must not hide an unparseable payload.
      - uses: actions/checkout@v4
        if: always()
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: always()
      - name: Check published payloads still match the frontend's contracts
        if: always()
        run: npm run check:contracts

      - name: Notify Telegram
        # Detection was never the problem. This job correctly reported
        # "114.2h old — Pi pipeline may be DOWN" every 30 minutes for 4.5 days
        # during the 2026-07-30 outage. Nobody saw it: a failing scheduled
        # workflow only produces GitHub's implicit email, while every other
        # alert in this fleet arrives on Telegram.
        # Inert until TELEGRAM_BOT_TOKEN + TELEGRAM_HOME_CHANNEL exist as repo
        # secrets. The checks above still fail the run either way.
        if: failure() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          msg = ("🔴 MapleGamma deadman FAILED — the live site is stale, "
                 "unparseable, or both.\n" + os.environ["RUN_URL"])
          data = json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=data, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as r:
              print("telegram:", r.status)
          PY
