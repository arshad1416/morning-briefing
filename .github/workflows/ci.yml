name: ci

# Code quality gates. The Pi pipeline commits machine-generated JSON to main
# every few minutes ("Live portfolio HH:MM" / "Analysis HH:MM" touching
# public/data/ and data/) — those commits must NOT trigger builds, so both
# triggers ignore the data paths. The deadman workflow covers data freshness.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'data/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'public/data/**'
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # AGENTS.md rule 5: a gated file must be registered in r2_sync PRIVATE_FILES,
      # .gitignore (both data/ and public/data/), and the Worker's data_gate.js.
      # Missing one silently leaks the file, or 404s it for paying subscribers.
      - name: Premium file registration (AGENTS.md rule 5)
        run: python3 scripts/check_premium_registration.py
      # generate-screener-data.py and fetch_universe_constituents.py run from
      # the Pi's repo checkout, so they DEPLOY BY MERGING (AGENTS.md rule 4) —
      # with nothing here they shipped to production untested. Named explicitly
      # rather than `unittest discover`: discovery imports every test_*.py in
      # the directory, and several pull in the Pi's pandas/yfinance venv. These
      # stub their market-data/boto3 deps and need no venv.
      # test_r2_sync_failure_split guards the 2026-07-30 outage (one Infinity
      # froze all publishing); it had rotted to 5/7 failing and was never run
      # here. test_run_step_timeout guards push_dashboard's per-step timeouts.
      - name: Pipeline tests (pi-scripts)
        working-directory: pi-scripts
        run: python3 -m unittest test_fetch_universe_constituents test_universe_membership test_volume_nan test_push_autostash_conflict test_generate_prediction_accuracy test_push_dashboard_basis test_r2_sync_failure_split test_run_step_timeout
      - run: npm run build

  worker-tests:
    name: Worker tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # Root deps first: the Playwright webServer runs `npm run build` from the
      # repo root, then serves the static export from out/.
      - run: npm ci
      - run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npm test
        working-directory: e2e
